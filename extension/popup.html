<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      width: 320px;
      margin: 0;
      padding: 14px;
    }
    h1 { font-size: 14px; margin: 0 0 4px; }
    #url {
      font-size: 11px;
      color: #666;
      word-break: break-all;
      margin-bottom: 12px;
      max-height: 32px;
      overflow: hidden;
    }
    button {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      font-weight: 600;
      border: 0;
      border-radius: 6px;
      background: #cc0000;
      color: #fff;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    .dl-row { display: flex; gap: 6px; margin-bottom: 6px; }
    .dl-row button { width: auto; flex: 1; min-width: 0; }
    #downloadClaude, #transcriptClaude { background: #6b3fd4; font-size: 13px; }
    #viewTranscript { background: #5f6368; font-size: 13px; }
    /* Transcript viewer overlay (fills the popup) */
    #transcriptView {
      position: fixed; inset: 0; z-index: 50;
      display: flex; flex-direction: column;
      background: Canvas; color: CanvasText;
    }
    #transcriptView[hidden] { display: none; }
    .tv-head { display: flex; gap: 6px; padding: 8px; border-bottom: 1px solid rgba(127,127,127,0.3); }
    .tv-head input {
      flex: 1; min-width: 0; padding: 6px; font-size: 12px;
      border: 1px solid #bbb; border-radius: 4px;
    }
    #tvClose { width: auto; flex: 0 0 auto; background: #5f6368; padding: 6px 10px; font-size: 13px; }
    .tv-status { padding: 8px; font-size: 12px; color: #777; }
    .tv-status:empty { display: none; }
    #transcriptList { flex: 1; overflow-y: auto; padding: 2px 8px; }
    .tv-cue {
      display: flex; gap: 8px; align-items: flex-start;
      padding: 4px 2px; border-radius: 4px; cursor: pointer;
    }
    .tv-cue:hover { background: rgba(127,127,127,0.12); }
    .tv-cue.between { background: rgba(29,185,84,0.14); }
    .tv-cue .t {
      flex: 0 0 auto; color: #1a73e8; font-size: 11px;
      font-variant-numeric: tabular-nums; padding-top: 1px;
    }
    .tv-cue .x { flex: 1; font-size: 12px; line-height: 1.35; }
    .tv-cue .io { flex: 0 0 auto; display: flex; gap: 2px; visibility: hidden; }
    .tv-cue:hover .io { visibility: visible; }
    .tv-cue .io button {
      width: auto; padding: 1px 5px; font-size: 10px; font-weight: 600;
      background: #5f6368; border-radius: 3px;
    }
    .tv-foot {
      display: flex; gap: 8px; align-items: center;
      padding: 8px; border-top: 1px solid rgba(127,127,127,0.3); font-size: 11px;
    }
    #tvSel { flex: 1; color: #666; }
    #tvUse { width: auto; flex: 0 0 auto; padding: 6px 10px; font-size: 12px; background: #1db954; }
    #tvUse:disabled { opacity: 0.5; cursor: default; }
    .field { margin-bottom: 10px; }
    .field label.cap {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #555;
      margin-bottom: 4px;
    }
    .pathrow { display: flex; gap: 6px; }
    .pathrow input {
      flex: 1;
      min-width: 0;
      padding: 7px;
      font-size: 12px;
      border: 1px solid #bbb;
      border-radius: 4px;
      font-family: ui-monospace, Consolas, monospace;
    }
    .pathrow button {
      width: auto;
      flex: 0 0 auto;
      padding: 7px 10px;
      font-size: 12px;
      background: #5f6368;
    }
    /* Trim / section selector */
    .trim { margin-bottom: 10px; }
    .trim-head { display: flex; align-items: center; gap: 8px; }
    .trim-quick { display: flex; gap: 6px; flex: 1; }
    .trim-quick button {
      width: auto; flex: 0 0 auto; padding: 5px 8px; font-size: 11px;
      font-weight: 600; background: #5f6368; color: #fff; border: 0;
      border-radius: 4px; cursor: pointer;
    }
    .trim-quick button:disabled { opacity: 0.5; cursor: default; }
    .trim-arrow {
      width: auto; flex: 0 0 auto; padding: 5px 8px; font-size: 11px;
      font-weight: 600; background: transparent; color: #1a73e8; border: 0;
      cursor: pointer;
    }
    .trim-arrow .caret { display: inline-block; transition: transform 0.15s; }
    .trim-arrow[aria-expanded="true"] .caret { transform: rotate(180deg); }
    #trimPanel { margin-top: 10px; }
    #trimPanel[hidden] { display: none; }
    .trim-slider-row { display: flex; align-items: center; gap: 8px; }
    .ts {
      width: 62px; flex: 0 0 auto; padding: 5px; font-size: 12px; text-align: center;
      border: 1px solid #bbb; border-radius: 4px;
      font-family: ui-monospace, Consolas, monospace;
    }
    .ts:disabled { opacity: 0.6; }
    /* Two-thumb slider: two range inputs overlaid on a shared track */
    .dual { position: relative; flex: 1; height: 24px; }
    .dual-track, .dual-fill {
      position: absolute; top: 50%; transform: translateY(-50%);
      height: 4px; border-radius: 2px;
    }
    .dual-track { left: 0; right: 0; background: rgba(127,127,127,0.3); }
    .dual-fill { background: #1db954; }
    .dual input[type="range"] {
      position: absolute; top: 0; left: 0; width: 100%; height: 24px; margin: 0;
      background: none; -webkit-appearance: none; appearance: none;
      pointer-events: none; /* only thumbs are interactive */
    }
    .dual input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none; pointer-events: auto;
      width: 14px; height: 14px; border-radius: 50%; background: #1db954;
      border: 2px solid #fff; box-shadow: 0 0 2px rgba(0,0,0,0.5); cursor: grab;
    }
    .dual input[type="range"]:disabled::-webkit-slider-thumb { background: #9aa0a6; cursor: default; }
    .trim-btn-row {
      display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 11px;
    }
    .trim-btn-row button {
      width: auto; flex: 0 0 auto; padding: 4px 8px; font-size: 11px;
      background: #5f6368; color: #fff; border: 0; border-radius: 4px; cursor: pointer;
    }
    .trim-btn-row button:disabled { opacity: 0.5; cursor: default; }
    #clipLen { flex: 1; text-align: center; color: #666; }
    #trimReset {
      flex: 0 0 auto; padding: 5px 8px; font-size: 11px; font-weight: 600;
      background: transparent; color: #1a73e8; border: 0; cursor: pointer;
    }
    #trimReset[hidden] { display: none; }
    .checks { display: flex; gap: 16px; margin-bottom: 12px; }
    .checks label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
      cursor: pointer;
    }
    .bar {
      height: 6px;
      border-radius: 3px;
      background: rgba(127,127,127,0.25);
      overflow: hidden;
      margin-top: 3px;
    }
    .bar > div {
      height: 100%;
      width: 0%;
      background: #1db954;
      transition: width 0.2s ease;
    }
    .bar > div.processing { background: #1a73e8; }
    #inProgress { margin-top: 14px; }
    #inProgress[hidden] { display: none; }
    .section-h2 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #888;
      margin: 0 0 6px;
    }
    .job-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 4px;
      border-radius: 5px;
    }
    .job-item:hover { background: rgba(127,127,127,0.12); }
    .job-item .jbody { flex: 1; min-width: 0; }
    .job-item .jlabel {
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .job-item .jstatus { font-size: 10px; color: #888; margin-top: 2px; }
    .job-item .jstatus.queued { color: #b06000; }
    .job-item .remove {
      flex: 0 0 auto;
      font-size: 14px;
      line-height: 1;
      color: #999;
      cursor: pointer;
      padding: 0 2px;
      visibility: hidden;
      user-select: none;
    }
    .job-item:hover .remove { visibility: visible; }
    .job-item .remove:hover { color: #c5221f; }
    .recent { margin-top: 14px; }
    .recent h2 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #888;
      margin: 0 0 6px;
    }
    .recent h2 .clear-link {
      float: right;
      color: #1a73e8;
      cursor: pointer;
      text-transform: none;
      letter-spacing: normal;
      font-weight: 600;
    }
    .recent h2 .clear-link:hover { text-decoration: underline; }
    .recent-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 4px;
      border-radius: 5px;
    }
    .recent-item:hover { background: rgba(127,127,127,0.12); }
    .recent-item .icon {
      flex: 0 0 auto;
      font-size: 15px;
      line-height: 1;
      cursor: pointer;
      user-select: none;
    }
    .recent-item .icon[draggable="true"] { cursor: grab; }
    .recent-item .name {
      flex: 1;
      min-width: 0;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }
    .recent-item .name:hover { text-decoration: underline; }
    .recent-item .remove {
      flex: 0 0 auto;
      font-size: 14px;
      line-height: 1;
      color: #999;
      cursor: pointer;
      padding: 0 2px;
      visibility: hidden;
      user-select: none;
    }
    .recent-item:hover .remove { visibility: visible; }
    .recent-item .remove:hover { color: #c5221f; }
    .recent-empty { font-size: 12px; color: #999; }
    #status {
      margin-top: 12px;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 220px;
      overflow: auto;
    }
    #status.ok { color: #137333; }
    #status a.folder-link { color: #1a73e8; text-decoration: underline; cursor: pointer; }
    #status.err { color: #c5221f; }
    #status.run { color: #1a73e8; }
    .links {
      margin-top: 12px;
      font-size: 11px;
    }
    .links a { color: #1a73e8; cursor: pointer; text-decoration: none; }
    pre {
      background: rgba(127,127,127,0.12);
      padding: 6px;
      border-radius: 4px;
      font-size: 11px;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <h1>yt-dlp Downloader</h1>
  <div id="url">Loading…</div>

  <div class="trim">
    <div class="trim-head">
      <div class="trim-quick">
        <button id="startToCurrent" type="button" title="Set range from the beginning to the player's current time">Start → current</button>
        <button id="currentToEnd" type="button" title="Set range from the player's current time to the end">Current → end</button>
      </div>
      <button id="trimReset" type="button" hidden>Reset</button>
      <button id="trimToggle" type="button" class="trim-arrow" aria-expanded="false" title="Trim to a section">Trim <span class="caret">▾</span></button>
    </div>
    <div id="trimPanel" hidden>
      <div class="trim-slider-row">
        <input type="text" id="startTime" class="ts" inputmode="numeric" />
        <div class="dual" id="dual">
          <div class="dual-track"></div>
          <div class="dual-fill" id="dualFill"></div>
          <input type="range" id="rngStart" min="0" max="100" step="0.1" value="0" />
          <input type="range" id="rngEnd" min="0" max="100" step="0.1" value="100" />
        </div>
        <input type="text" id="endTime" class="ts" inputmode="numeric" />
      </div>
      <div class="trim-btn-row">
        <button id="startCur" type="button">current</button>
        <span id="clipLen">Full video</span>
        <button id="endCur" type="button">current</button>
      </div>
    </div>
  </div>

  <div class="field">
    <label class="cap" for="path">Download to</label>
    <div class="pathrow">
      <input type="text" id="path" placeholder="C:\Users\you\Downloads" />
      <button id="browse">Browse…</button>
    </div>
  </div>

  <div class="checks">
    <label><input type="checkbox" id="transcript" /> Transcript</label>
    <label><input type="checkbox" id="newFolder" /> New Folder</label>
    <label id="premiereLabel"><input type="checkbox" id="premiere" /> Premiere</label>
  </div>

  <div class="dl-row">
    <button id="download">Download this video</button>
    <button id="downloadClaude" title="Download, then open Claude Code in the folder to find clips">Download → Claude</button>
  </div>
  <div class="dl-row">
    <button id="viewTranscript" title="View the transcript; click a line to seek, set in/out to trim">View transcript</button>
    <button id="transcriptClaude" title="Send only the transcript + metadata (no video) to Claude Code">Transcript → Claude</button>
  </div>

  <div id="status"></div>

  <div id="inProgress" hidden>
    <h2 class="section-h2">In progress</h2>
    <div id="inProgressList"></div>
  </div>

  <div class="recent">
    <h2>Recent downloads <a id="clearRecent" class="clear-link" hidden>Clear</a></h2>
    <div id="recentList"><div class="recent-empty">No downloads yet.</div></div>
  </div>

  <div class="links"><a id="opts">Settings</a></div>

  <div id="transcriptView" hidden>
    <div class="tv-head">
      <input id="tvSearch" type="text" placeholder="Search transcript…" />
      <button id="tvClose" title="Close (Esc)">✕</button>
    </div>
    <div id="tvStatus" class="tv-status"></div>
    <div id="transcriptList"></div>
    <div class="tv-foot">
      <span id="tvSel">No selection</span>
      <button id="tvUse" disabled>Use selection</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
